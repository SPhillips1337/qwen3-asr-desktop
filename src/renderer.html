<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qwen3 ASR</title>
<style>
body{font:14px system-ui,sans-serif;margin:22px;color:#202124;background:#f8f9fa}h1{font-size:22px;margin:0 0 5px}.muted{color:#687078}.card{background:white;border:1px solid #dadce0;border-radius:10px;padding:15px;margin:14px 0}label{display:block;margin:11px 0 4px;font-weight:600}input,select{box-sizing:border-box;width:100%;padding:8px;font:inherit;border:1px solid #bdc1c6;border-radius:6px}button{padding:9px 13px;border:1px solid #9aa0a6;border-radius:7px;background:#fff;font:inherit;cursor:pointer}button.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.status{padding:12px;border-radius:8px;background:#eef3fd;margin:14px 0}.record{font-size:16px;width:100%;padding:13px}.error{color:#b3261e;white-space:pre-wrap}.transcript{white-space:pre-wrap;min-height:42px}
</style></head>
<body><h1>Qwen3 ASR</h1><div class="muted">Windows voice typing for the focused application</div><div id="status" class="status">Ready</div><button id="record" class="primary record">Start recording</button><div class="card"><strong>Last transcript</strong><div id="transcript" class="transcript muted">Nothing transcribed yet.</div></div><div class="card"><strong>Settings</strong><label for="server">ASR server URL</label><input id="server" type="url"><label for="key">ASR API key <span id="key-state" class="muted"></span></label><input id="key" type="password" autocomplete="off" placeholder="Leave blank to keep the saved key"><label for="shortcut">Hold-to-talk shortcut</label><input id="shortcut" maxlength="64" placeholder="Ctrl+Alt+Shift+Space"><label for="language">Language (optional)</label><input id="language" maxlength="16" placeholder="Auto detect"><label><input id="paste" type="checkbox" style="width:auto"> Paste transcript into the focused application</label><label><input id="startup" type="checkbox" style="width:auto"> Start with Windows hidden in the tray</label><div class="row"><button id="save" class="primary">Save settings</button><button id="health">Check server</button></div><div id="message" class="error"></div></div><script type="module" src="renderer.js"></script></body></html>
